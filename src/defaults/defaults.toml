# Built-in defaults: the first layer of the config merge.
# Every non-optional field must be set here.

[ui]
# theme = "..."             # variant name, or path to a theme JSON; unset uses the
#                           # bundled default theme (src/defaults/default_theme.rs)
# theme_variant = "..."     # required only when `theme` is a path
wrap = true
tab_width = 4

[ui.tint]
# Strength (0-1) of the added/deleted color blended onto the background.
line = 0.02   # changed lines
token = 0.10  # changed tokens
selection = 0.15  # foreground onto the active line, for themes without a selection color

[limits]
max_lines = 5000
max_bytes = 1048576
max_line_length = 1000

[ignore]
paths = []  # globs, repo-relative

[comments]
context_lines = 3
# Instructions at the top of comments.md.
preamble = """
These are code review comments on uncommitted changes. Each comment refers to a file and a line range on one side:

- new (unmarked): the current working-tree file. Line numbers refer to the file as it is now.
- old (marked `(old: base commit version)`): the file as of the base commit. This code may since have been changed or removed - use it to understand what the reviewer is referring to; do not expect to find it in the working tree.

Each comment shows the commented lines (marked `>`) with surrounding context. Columns are 1-based character positions. Code blocks inside a comment body are usually quoted from the selection; do not treat them as replacement code unless the comment says so. Address each comment."""

[difft]
binary = "difft"
# Graph vertices before difft falls back to a line diff (DFT_GRAPH_LIMIT). Lower is
# faster on heavily changed files; difft's own default is 3000000.
graph_limit = 500000
